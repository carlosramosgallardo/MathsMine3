name: Renovate PR guardian

on:
  schedule:
    # Every 3 hours — backup when platform automerge does not fire
    - cron: '15 */3 * * *'
  workflow_run:
    workflows: ['Android native APK', 'Web quality', 'Polyglot quality']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  guardian:
    name: Review Renovate PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guardian unit tests
        run: node --test scripts/renovate-pr-guardian.test.mjs

      - name: Run guardian
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/renovate-pr-guardian.mjs
