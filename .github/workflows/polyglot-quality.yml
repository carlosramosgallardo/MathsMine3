name: Polyglot quality

on:
  push:
    branches: [main]
    paths:
      - 'app/api/**'
      - 'lib/ranks.js'
      - 'lib/training-game.ts'
      - 'lib/dice.ts'
      - 'apps/android-native/app/src/main/java/xyz/mathsmine3/nativeapp/ui/theme/RankTiers.kt'
      - 'apps/android-native/app/src/main/java/xyz/mathsmine3/nativeapp/training/TrainingProblem.kt'
      - 'packages/api-contracts/**'
      - 'packages/realtime-protocol/**'
      - 'packages/game-tables/**'
      - 'packages/mm3-math/**'
      - 'tools/**'
      - 'features/**'
      - 'fastlane/**'
      - 'play-store-listing/**'
      - 'policy/**'
      - 'scripts/windows/**'
      - 'Makefile'
      - 'Gemfile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/api/**'
      - 'lib/ranks.js'
      - 'lib/training-game.ts'
      - 'lib/dice.ts'
      - 'apps/android-native/app/src/main/java/xyz/mathsmine3/nativeapp/ui/theme/RankTiers.kt'
      - 'apps/android-native/app/src/main/java/xyz/mathsmine3/nativeapp/training/TrainingProblem.kt'
      - 'packages/api-contracts/**'
      - 'packages/realtime-protocol/**'
      - 'packages/game-tables/**'
      - 'packages/mm3-math/**'
      - 'tools/**'
      - 'features/**'
      - 'fastlane/**'
      - 'play-store-listing/**'
      - 'policy/**'
      - 'scripts/windows/**'
      - 'Makefile'
      - 'Gemfile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Polyglot checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
          cache-dependency-path: tools/go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/mm3-math

      - name: Install Lua, Ruby, conftest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 ruby
          curl -fsSL -o /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.59.0/conftest_0.59.0_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/conftest.tar.gz -C /usr/local/bin conftest

      - name: Install pytest
        run: python3 -m pip install -r tools/balance/requirements.txt

      - name: Run polyglot checks
        run: make check LUA=lua5.4
