# Release cut: always run web + portal QA on version tags (no path filter).
# PRs use path-filtered web-quality.yml and portal-qa.yml separately.
name: Game QA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      portal_phases:
        description: 'Portal QA phases (comma-separated, or all)'
        required: false
        default: '1,2'

permissions:
  contents: read

jobs:
  lint:
    name: Lint and build
    uses: ./.github/workflows/web-quality.yml

  portal:
    name: Portal QA
    needs: lint
    uses: ./.github/workflows/portal-qa.yml
    with:
      portal_phases: ${{ inputs.portal_phases || '1,2' }}
