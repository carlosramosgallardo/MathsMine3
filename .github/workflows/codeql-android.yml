# CodeQL for the Android Kotlin app.
# Default setup uses build-mode: none, which cannot extract Kotlin — it needs a
# traced Gradle compile so the CodeQL extractor sees kotlinc.
name: CodeQL Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-native/**'
      - '.github/workflows/codeql-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/android-native/**'
      - '.github/workflows/codeql-android.yml'
  schedule:
    # Weekly catch-up if Android paths did not change
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Android (traced for CodeQL)
        working-directory: apps/android-native
        env:
          # BuildConfig needs these; empty is fine for analysis (compile still runs).
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 'codeql-placeholder.apps.googleusercontent.com'
          # Kotlin Gradle plugin defaults to in-process kotlinc — CodeQL's tracer
          # only sees a separate process, so force out-of-process compilation.
          ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy: out-of-process
        run: |
          if [[ ! -f local.properties ]]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          # Also pin in gradle.properties for this job (property env above can be flaky).
          echo 'kotlin.compiler.execution.strategy=out-of-process' >> gradle.properties
          # Force a real kotlinc run — cache hits hide sources from the CodeQL tracer.
          ./gradlew :app:compileDebugKotlin \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            -Dkotlin.compiler.execution.strategy=out-of-process
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
