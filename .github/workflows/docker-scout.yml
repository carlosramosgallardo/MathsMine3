name: Docker Scout

on:
  push:
    branches: [main]
    paths: &scout_paths
      - '.cursor/Dockerfile'
      - '.cursor/environment.json'
      - '.github/workflows/docker-scout.yml'
  pull_request:
    paths: *scout_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scout:
    name: Scout Cursor image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Hub credentials: add DOCKER_USER + DOCKER_PAT to Environment "env"
    # (same place as other repo secrets), or as repository secrets.
    environment: env
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_PAT != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build Cursor agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .cursor/Dockerfile
          load: true
          tags: mathsmine3-cursor:scout
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Scout CVEs and recommendations
        if: ${{ secrets.DOCKER_USER != '' && secrets.DOCKER_PAT != '' }}
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves,recommendations
          image: local://mathsmine3-cursor:scout
          dockerhub-user: ${{ secrets.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_PAT }}
          only-severities: critical,high
          write-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary: true

      - name: Skip Scout when Hub credentials are missing
        if: ${{ secrets.DOCKER_USER == '' || secrets.DOCKER_PAT == '' }}
        run: |
          echo '::warning::DOCKER_USER / DOCKER_PAT not set; image was built but Scout was skipped.'
          echo 'Add both secrets to the GitHub Environment "env" (or repository secrets), then re-run.'
