name: Docker Scout

on:
  push:
    branches: [main]
    paths: &scout_paths
      - '.cursor/Dockerfile'
      - '.cursor/environment.json'
      - '.github/workflows/docker-scout.yml'
  pull_request:
    paths: *scout_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scout:
    name: Scout Cursor image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    # Requires DOCKER_USER + DOCKER_PAT in Environment "env".
    environment: env
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build Cursor agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .cursor/Dockerfile
          load: true
          tags: mathsmine3-cursor:scout
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Split from `recommendations` because `sarif-file` only applies to `cves`.
      - name: Docker Scout CVEs
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: local://mathsmine3-cursor:scout
          dockerhub-user: ${{ secrets.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_PAT }}
          only-severities: critical,high
          sarif-file: scout-cves.sarif
          write-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary: true

      - name: Docker Scout base image recommendations
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: recommendations
          image: local://mathsmine3-cursor:scout
          dockerhub-user: ${{ secrets.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_PAT }}
          write-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary: true

      # Code Scanning rejects a result with more than 1000 related locations;
      # Scout emits one per affected package and the base image blows past it.
      - name: Trim SARIF related locations
        if: always() && hashFiles('scout-cves.sarif') != ''
        run: |
          jq '.runs[].results[]? |= (
                if ((.relatedLocations // []) | length) > 1000
                then .relatedLocations |= .[0:1000]
                else . end
              )' scout-cves.sarif > scout-cves.trimmed.sarif
          mv scout-cves.trimmed.sarif scout-cves.sarif

      # PR comments race the merge (Sonar goes green minutes earlier), so the
      # findings also land in Code Scanning where they persist.
      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('scout-cves.sarif') != ''
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: scout-cves.sarif
          category: docker-scout
