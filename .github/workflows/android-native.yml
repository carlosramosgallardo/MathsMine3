name: Android native APK

on:
  push:
    branches: [main]
    paths: &apk_paths
      - 'apps/android-native/**'
      - 'scripts/android-native-build.sh'
      - '.github/workflows/android-native.yml'
    tags:
      - 'v*'
  pull_request:
    paths: *apk_paths
  workflow_dispatch:

# Workflow-level permissions must be static (no ${{ }}). Tag release + stamp need write on the job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Secrets live in GitHub Environment "env" (not repo-level secrets).
    environment: env
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Accept licenses & install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Write portal env for Gradle (public client keys)
        working-directory: ${{ github.workspace }}
        env:
          # Prefer repo Actions Variables (Settings → Variables); Secrets also work.
          VAR_GOOGLE: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          VAR_SUPA_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          VAR_SUPA_ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEC_GOOGLE: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          SEC_SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SEC_SUPA_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          GOOGLE="${SEC_GOOGLE:-$VAR_GOOGLE}"
          SUPA_URL="${SEC_SUPA_URL:-$VAR_SUPA_URL}"
          SUPA_ANON="${SEC_SUPA_ANON:-$VAR_SUPA_ANON}"
          {
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPA_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPA_ANON}"
          } > .env.local
          if [ -z "$GOOGLE" ]; then
            echo "::warning::NEXT_PUBLIC_GOOGLE_CLIENT_ID empty — set repo Variable/Secret for Google Sign-In in the APK"
          fi

      - name: Assemble debug APK
        working-directory: apps/android-native
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        id: stage
        run: |
          mkdir -p dist/release
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VER="pr-${{ github.event.pull_request.number }}"
          else
            VER="${GITHUB_REF_NAME:-debug}"
            VER="${VER#v}"
          fi
          # Sanitize ref names (e.g. "123/merge") for filenames.
          VER="${VER//\//-}"
          VERSIONED="dist/release/mathsmine3-${VER}.apk"
          cp -f apps/android-native/app/build/outputs/apk/debug/app-debug.apk "$VERSIONED"
          # Stable name for Actions artifact consumers (NOT in release/ — avoids duplicate upload)
          cp -f "$VERSIONED" dist/mathsmine3-native-debug.apk
          ls -lh dist/ dist/release/
          echo "versioned_apk=$VERSIONED" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mathsmine3-native-debug
          path: |
            dist/mathsmine3-native-debug.apk
            dist/release/*.apk
          if-no-files-found: error
          retention-days: 90

      # softprops/action-gh-release@v2 runs on deprecated Node 20.
      # v3 uses Node 24. Also: never glob the same APK twice — `mathsmine3-*.apk`
      # previously matched both the versioned file AND mathsmine3-native-debug.apk,
      # causing parallel delete races ("Not Found" on delete-a-release-asset).
      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # One unique file only — duplicate globs caused delete races (404 Not Found).
          files: ${{ steps.stage.outputs.versioned_apk }}
          overwrite_files: true
          fail_on_unmatched_files: true
          # Don't overwrite hand-written release notes / AAB assets from a prior `gh release create`.
          generate_release_notes: false
          draft: false
          prerelease: false
          name: MathsMine3 ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stamp main with the tag that actually shipped an APK. github-actions[bot]
      # authors this commit (GITHUB_TOKEN does not retrigger this workflow).
      - name: Record last GitHub Release on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout --force -B main origin/main
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          jq -n \
            --arg tag "$TAG" \
            --arg version "$VER" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg apk "mathsmine3-${VER}.apk" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag:$tag,version:$version,sourceCommit:$sourceCommit,apk:$apk,releaseUrl:$releaseUrl,builtAt:$builtAt}' \
            > apps/android-native/ci-last-github-release.json
          git add apps/android-native/ci-last-github-release.json
          if git diff --staged --quiet; then
            echo "Release stamp unchanged"
            exit 0
          fi
          git commit -m "Record GitHub Android release ${GITHUB_REF_NAME}."
          git push origin HEAD:main
