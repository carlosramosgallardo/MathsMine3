name: Android native APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-native/**'
      - 'scripts/android-native-build.sh'
      - '.github/workflows/android-native.yml'
      - 'docs/PLATFORMS.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Secrets live in GitHub Environment "env" (not repo-level secrets).
    environment: env
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Write portal env for Gradle (public client keys)
        working-directory: ${{ github.workspace }}
        env:
          # Prefer repo Actions Variables (Settings → Variables); Secrets also work.
          VAR_GOOGLE: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          VAR_SUPA_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          VAR_SUPA_ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEC_GOOGLE: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          SEC_SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SEC_SUPA_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          GOOGLE="${SEC_GOOGLE:-$VAR_GOOGLE}"
          SUPA_URL="${SEC_SUPA_URL:-$VAR_SUPA_URL}"
          SUPA_ANON="${SEC_SUPA_ANON:-$VAR_SUPA_ANON}"
          {
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPA_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPA_ANON}"
          } > .env.local
          if [ -z "$GOOGLE" ]; then
            echo "::warning::NEXT_PUBLIC_GOOGLE_CLIENT_ID empty — set repo Variable/Secret for Google Sign-In in the APK"
          fi

      - name: Assemble debug APK
        working-directory: apps/android-native
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME:-debug}"
          # Strip leading v from tags like v0.1.0-beta.1
          VER="${VER#v}"
          OUT="dist/mathsmine3-${VER}.apk"
          cp -f apps/android-native/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          # Stable name for Actions artifact consumers
          cp -f "$OUT" dist/mathsmine3-native-debug.apk
          ls -lh dist/

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathsmine3-native-debug
          path: |
            dist/mathsmine3-native-debug.apk
            dist/mathsmine3-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mathsmine3-native-debug.apk
            dist/mathsmine3-*.apk
          generate_release_notes: true
          draft: false
          # Latest on repo home (SemVer -beta.N stays in the version string).
          prerelease: false
          name: MathsMine3 ${{ github.ref_name }}
          body: |
            ## MathsMine3 `${{ github.ref_name }}`

            Compose-native Android client (`xyz.mathsmine3.app`).
            Same backends as the web portal: [mathsmine3.xyz](https://mathsmine3.xyz) APIs + Supabase.

            ### Highlights (beta.5)
            - Play Internal: `targetSdk` / `compileSdk` **35**, versionCode **29**
            - Release signing + native `SYMBOL_TABLE` symbols for AAB
            - Portal QA harness (`qa:sweep` / `qa:portal`)

            ### Carried from beta.4
            - Android presence via `/api/presence/ping` (session)
            - Lock anon writes on wallet pool tables
            - ProGuard rules; Play release checklist

            ### Native shell
            - Training, Trading, Squeezing, Relaying, Daily, MM3 Chart, Ranking, AI Team, Manifesto
            - API, SEC, Privacy, Terms (native screens)
            - Portal header, auth, footer (**ETH** donate, BMC, PAT)

            ### WebView (by design)
            - **Home** — arena + minimap (`/embed/home-arena`, `/embed/home-minimap`)
            - **Mining** — FPV (`/embed/mining`)

            > Sideload **debug** APK on this release — not the Play-signed AAB.
            > Play Internal testing uses the signed AAB built locally (`npm run android:native:bundle`).

            ### Install (sideload)
            1. Download the attached APK (`mathsmine3-native-debug.apk` or `mathsmine3-*.apk`)
            2. Sideload on a device/emulator (USB debugging or file install)
            3. Package id: `xyz.mathsmine3.app`

            See [docs/PLATFORMS.md](docs/PLATFORMS.md), [`apps/android-native/README.md`](apps/android-native/README.md), and [`PLAY_RELEASE.md`](apps/android-native/PLAY_RELEASE.md).

            > Debug / sideload build — not a Play Store production signing release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
