name: Android native APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-native/**'
      - 'scripts/android-native-build.sh'
      - '.github/workflows/android-native.yml'
      - 'docs/PLATFORMS.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Secrets live in GitHub Environment "env" (not repo-level secrets).
    environment: env
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Write portal env for Gradle (public client keys)
        working-directory: ${{ github.workspace }}
        env:
          # Prefer repo Actions Variables (Settings → Variables); Secrets also work.
          VAR_GOOGLE: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          VAR_SUPA_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          VAR_SUPA_ANON: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEC_GOOGLE: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          SEC_SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SEC_SUPA_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          GOOGLE="${SEC_GOOGLE:-$VAR_GOOGLE}"
          SUPA_URL="${SEC_SUPA_URL:-$VAR_SUPA_URL}"
          SUPA_ANON="${SEC_SUPA_ANON:-$VAR_SUPA_ANON}"
          {
            echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPA_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPA_ANON}"
          } > .env.local
          if [ -z "$GOOGLE" ]; then
            echo "::warning::NEXT_PUBLIC_GOOGLE_CLIENT_ID empty — set repo Variable/Secret for Google Sign-In in the APK"
          fi

      - name: Assemble debug APK
        working-directory: apps/android-native
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME:-debug}"
          # Strip leading v from tags like v0.1.0-beta.1
          VER="${VER#v}"
          OUT="dist/mathsmine3-${VER}.apk"
          cp -f apps/android-native/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          # Stable name for Actions artifact consumers
          cp -f "$OUT" dist/mathsmine3-native-debug.apk
          ls -lh dist/

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathsmine3-native-debug
          path: |
            dist/mathsmine3-native-debug.apk
            dist/mathsmine3-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mathsmine3-native-debug.apk
            dist/mathsmine3-*.apk
          generate_release_notes: true
          draft: false
          # Latest on repo home (SemVer -beta.N stays in the version string).
          prerelease: false
          name: MathsMine3 ${{ github.ref_name }}
          body: |
            ## MathsMine3 `${{ github.ref_name }}`

            First public **beta** of the Compose-native Android client (`xyz.mathsmine3.app`).
            Same product backends as the web portal: [mathsmine3.xyz](https://mathsmine3.xyz) APIs + Supabase.

            ### Native in this build (Kotlin / Jetpack Compose)
            - App shell, portal header, home nonagon / portal access
            - **Training** — problems, countdown, NFTJI / Supabase
            - **Trading** — SELL / EXEC, rates, TX log
            - **Squeezing** — pool / dispute cards + live polls
            - **Relaying** — IRC-style terminal (`/?`, `/mine`, `/buy`, `/resell`, `/exec`, chat)
            - **Daily Tasks** — progress + claim
            - **MM3 Chart** — in-app ranges (no external browser)
            - **Ranking** — wallets / pools
            - **AI Team** — bots + live leaderboard hooks
            - **Manifesto** — EN/ES from bundled markdown
            - Auth (Google + wallet session) and footer support links (**ETH** donate, BMC, PAT, docs)

            ### Still WebView (by design for this beta)
            - **Mining** FPV only (`/embed/mining`)

            ### Install
            1. Download the attached APK (`mathsmine3-0.1.0-beta.1.apk` or `mathsmine3-native-debug.apk`)
            2. Sideload on a device/emulator (USB debugging or file install)
            3. Package id: `xyz.mathsmine3.app`

            See [docs/PLATFORMS.md](docs/PLATFORMS.md) and [`apps/android-native/README.md`](apps/android-native/README.md).

            > Debug / sideload build — not a Play Store production signing release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
