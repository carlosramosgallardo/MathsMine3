name: Web quality

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'next.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/web-quality.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'next.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/web-quality.yml'

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate API documentation sync
        run: node scripts/build-api-documentation.mjs
