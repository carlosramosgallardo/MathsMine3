name: Web quality

on:
  push:
    branches: [main]
    paths: &web_paths
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'next.config.js'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - 'proxy.ts'
      - 'vercel.json'
      - '.github/workflows/web-quality.yml'
      - '.github/workflows/game-qa.yml'
  pull_request:
    paths: *web_paths
  workflow_dispatch:
    inputs:
      portal_phases:
        description: 'Portal QA phases (comma-separated, or all)'
        required: false
        default: '1,2'
  workflow_call:
    inputs:
      portal_phases:
        description: 'Portal QA phases (comma-separated, or all)'
        type: string
        required: false
        default: '1,2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Inlined at build time so production `next start` can hydrate chrome
      # without real secrets. Portal phases 1–2 are read-only.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.signature
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Game unit tests
        run: npm test

      - name: Unit sweep
        run: npm run qa:sweep:unit

      - name: Production build
        run: npm run build

      - name: Validate API documentation sync
        run: node scripts/build-api-documentation.mjs

      - name: Install Playwright Chromium
        # Local CLI from npm ci (lockfile-pinned). Avoid npx: Sonar S6505/S8543.
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 &
          bash scripts/ci-wait-http.sh http://127.0.0.1:3000

      - name: Portal QA
        run: node scripts/qa-portal.mjs --base http://127.0.0.1:3000 --phase "${PHASES}"
        env:
          CI: 'true'
          PHASES: ${{ inputs.portal_phases || '1,2' }}
