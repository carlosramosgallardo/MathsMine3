sonar.projectKey=carlosramosgallardo_MathsMine3
sonar.organization=carlosramosgallardo

sonar.sources=app,components,lib,scripts,proxy.ts
sonar.exclusions=**/node_modules/**,**/.next/**,apps/android-native/**,android/**,play-store-listing/**,public/**,Gemfile,**/Gemfile.lock

# Automatic Analysis still scanned lockfile/manifest paths after exclusions.
# Keep these ignores so a missing-lockfile finding cannot hold main at security C.
sonar.issue.ignore.multicriteria=lock1,lock2,backup1
sonar.issue.ignore.multicriteria.lock1.ruleKey=text:S8568
sonar.issue.ignore.multicriteria.lock1.resourceKey=**/Gemfile
sonar.issue.ignore.multicriteria.lock2.ruleKey=text:S8569
sonar.issue.ignore.multicriteria.lock2.resourceKey=**/*
sonar.issue.ignore.multicriteria.backup1.ruleKey=xml:S6358
sonar.issue.ignore.multicriteria.backup1.resourceKey=**/AndroidManifest.xml

# Boss maps share intentional parallel structure (factory + per-map constants).
sonar.cpd.exclusions=\
  **/app/api/m3-boss/**,\
  **/app/api/m4-boss/**,\
  **/app/api/m5-boss/**,\
  **/lib/m3-putin-boss.js,\
  **/lib/m4-kim-boss.js,\
  **/lib/m5-trump-boss.js,\
  **/lib/m3-putin-boss-runtime.js,\
  **/lib/m4-kim-boss-runtime.js,\
  **/lib/m5-trump-boss-runtime.js
